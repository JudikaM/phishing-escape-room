<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <!-- Deep Cyber Space Gradient -->
    <linearGradient id="bg-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030713"/>
      <stop offset="40%" stop-color="#050d1d"/>
      <stop offset="85%" stop-color="#02050b"/>
      <stop offset="100%" stop-color="#010307"/>
    </linearGradient>

    <!-- Stage Bloom behind Sentinel Robot (Right Side) -->
    <radialGradient id="robot-stage-glow" cx="74%" cy="48%" r="38%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.18)"/>
      <stop offset="40%" stop-color="rgba(0, 140, 220, 0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Soft Ambient Warmth for Incident / Lockdown Header -->
    <radialGradient id="lockdown-ambient" cx="28%" cy="5%" r="42%">
      <stop offset="0%" stop-color="rgba(255, 38, 74, 0.15)"/>
      <stop offset="50%" stop-color="rgba(255, 38, 74, 0.03)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Center Stage Ambient Diffuse (Connects Left & Right) -->
    <radialGradient id="center-diffuse" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(12, 28, 54, 0.35)"/>
      <stop offset="60%" stop-color="rgba(5, 12, 24, 0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Smooth Edge Fade Mask for Technical Grid -->
    <radialGradient id="grid-fade-mask" cx="50%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask">
      <rect width="1600" height="900" fill="url(#grid-fade-mask)"/>
    </mask>

    <!-- Linear Horizon Mask for Floor Perspective -->
    <linearGradient id="floor-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <mask id="floor-mask">
      <rect width="1600" height="900" fill="url(#floor-fade)"/>
    </mask>
  </defs>

  <!-- 1. Deep Cyber Backdrop -->
  <rect width="1600" height="900" fill="url(#bg-deep)"/>

  <!-- 2. Ambient Lighting Blooms (Soft, Cinematic, Professional) -->
  <rect width="1600" height="900" fill="url(#center-diffuse)"/>
  <rect width="1600" height="900" fill="url(#lockdown-ambient)"/>
  <rect width="1600" height="900" fill="url(#robot-stage-glow)"/>

  <!-- 3. Architectural CAD Grid with Smooth Radial Edge Fade -->
  <g mask="url(#grid-mask)" stroke="rgba(0, 229, 255, 0.06)" stroke-width="1">
    <!-- Vertical Cad Lines -->
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
    <line x1="1500" y1="0" x2="1500" y2="900"/>

    <!-- Horizontal Cad Lines -->
    <line x1="0" y1="80" x2="1600" y2="80"/>
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="240" x2="1600" y2="240"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="0" y1="560" x2="1600" y2="560"/>
    <line x1="0" y1="640" x2="1600" y2="640"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
  </g>

  <!-- 4. Subtle Precision Intersection Points (Matrix Nodes) -->
  <g mask="url(#grid-mask)" fill="rgba(0, 229, 255, 0.28)">
    <circle cx="300" cy="160" r="1.5"/>
    <circle cx="600" cy="160" r="1.5"/>
    <circle cx="900" cy="160" r="1.5"/>
    <circle cx="1200" cy="160" r="1.5"/>

    <circle cx="300" cy="320" r="1.5"/>
    <circle cx="600" cy="320" r="1.5"/>
    <circle cx="900" cy="320" r="1.5"/>
    <circle cx="1200" cy="320" r="1.5"/>

    <circle cx="300" cy="480" r="1.5"/>
    <circle cx="600" cy="480" r="1.5"/>
    <circle cx="900" cy="480" r="1.5"/>
    <circle cx="1200" cy="480" r="1.5"/>

    <circle cx="300" cy="640" r="1.5"/>
    <circle cx="600" cy="640" r="1.5"/>
    <circle cx="900" cy="640" r="1.5"/>
    <circle cx="1200" cy="640" r="1.5"/>
  </g>

  <!-- 5. Low-Profile Perspective Ground Grid (Clean Studio Horizon) -->
  <g mask="url(#floor-mask)" stroke="rgba(0, 229, 255, 0.08)" stroke-width="1">
    <!-- Clean Horizon -->
    <line x1="0" y1="460" x2="1600" y2="460" stroke="rgba(0, 229, 255, 0.14)"/>
    <!-- Gentle Orthogonal Rays -->
    <line x1="800" y1="460" x2="40" y2="900"/>
    <line x1="800" y1="460" x2="280" y2="900"/>
    <line x1="800" y1="460" x2="520" y2="900"/>
    <line x1="800" y1="460" x2="720" y2="900"/>
    <line x1="800" y1="460" x2="880" y2="900"/>
    <line x1="800" y1="460" x2="1080" y2="900"/>
    <line x1="800" y1="460" x2="1320" y2="900"/>
    <line x1="800" y1="460" x2="1560" y2="900"/>

    <!-- Depth Perspective Traverses -->
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="550" x2="1600" y2="550"/>
    <line x1="0" y1="615" x2="1600" y2="615"/>
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="805" x2="1600" y2="805"/>
  </g>

  <!-- 6. Architectural Server Rack Telemetry Silhouettes (Left & Right Flanks) -->
  <!-- Left Telemetry Columns -->
  <g stroke="rgba(0, 229, 255, 0.12)" stroke-width="1">
    <line x1="60" y1="120" x2="60" y2="820"/>
    <line x1="160" y1="160" x2="160" y2="780" stroke="rgba(0, 229, 255, 0.06)"/>
    <!-- Clean Horizontal Module Lines -->
    <path d="M60,180 h24 M60,240 h24 M60,300 h24 M60,360 h24 M60,420 h24 M60,480 h24 M60,540 h24 M60,600 h24 M60,660 h24 M60,720 h24" stroke="rgba(0, 229, 255, 0.14)"/>
    <!-- Subtle Precision Fiber Indicators -->
    <circle cx="92" cy="240" r="1.5" fill="#00e5ff" opacity="0.6"/>
    <circle cx="92" cy="360" r="1.5" fill="#00e5ff" opacity="0.4"/>
    <circle cx="92" cy="480" r="1.5" fill="#ff264a" opacity="0.65"/>
    <circle cx="92" cy="600" r="1.5" fill="#00e5ff" opacity="0.5"/>
  </g>

  <!-- Right Telemetry Columns -->
  <g stroke="rgba(0, 229, 255, 0.12)" stroke-width="1">
    <line x1="1540" y1="120" x2="1540" y2="820"/>
    <line x1="1440" y1="160" x2="1440" y2="780" stroke="rgba(0, 229, 255, 0.06)"/>
    <!-- Clean Horizontal Module Lines -->
    <path d="M1516,180 h24 M1516,240 h24 M1516,300 h24 M1516,360 h24 M1516,420 h24 M1516,480 h24 M1516,540 h24 M1516,600 h24 M1516,660 h24 M1516,720 h24" stroke="rgba(0, 229, 255, 0.14)"/>
    <!-- Subtle Precision Fiber Indicators -->
    <circle cx="1508" cy="180" r="1.5" fill="#00e5ff" opacity="0.5"/>
    <circle cx="1508" cy="300" r="1.5" fill="#00e5ff" opacity="0.7"/>
    <circle cx="1508" cy="540" r="1.5" fill="#00e5ff" opacity="0.4"/>
    <circle cx="1508" cy="660" r="1.5" fill="#ff264a" opacity="0.6"/>
  </g>

  <!-- 7. Precision CAD HUD Markings -->
  <g stroke="rgba(0, 229, 255, 0.22)" stroke-width="1">
    <!-- Top-Left Corner Bracket -->
    <path d="M40,50 L40,30 L60,30"/>
    <!-- Top-Right Corner Bracket -->
    <path d="M1560,50 L1560,30 L1540,30"/>
    <!-- Bottom-Left Corner Bracket -->
    <path d="M40,850 L40,870 L60,870"/>
    <!-- Bottom-Right Corner Bracket -->
    <path d="M1560,850 L1560,870 L1540,870"/>

    <!-- Subtle Crosshair Coordinates -->
    <path d="M350,70 v-5 m0,10 v-5 M345,70 h10"/>
    <path d="M1250,70 v-5 m0,10 v-5 M1245,70 h10"/>
  </g>

  <!-- 8. Subtle Telemetry Metadata Labels (Low Contrast, Atmospheric) -->
  <g fill="rgba(0, 229, 255, 0.22)" font-family="monospace" font-size="8.5" letter-spacing="1.5">
    <text x="45" y="24">SEC_07 // SERVER ROOM CONTAINMENT</text>
    <text x="1435" y="24" text-anchor="end">SYS_TELEMETRY [SECURE]</text>
    <text x="45" y="888">INCIDENT_ID // 001-ALPHA</text>
    <text x="1555" y="888" text-anchor="end">STATUS // ISOLATED</text>
  </g>
</svg>